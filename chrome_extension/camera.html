<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudNet Control 시험 카메라</title>
  <link rel="stylesheet" href="camera.css">
  <script src="camera.js" defer></script>
</head>
<body>
  <main>
    <h1>시험 카메라</h1>
    <p id="status" role="status">시험 연결을 확인하는 중입니다.</p>
    <video id="preview" aria-label="카메라 미리보기" autoplay muted playsinline hidden></video>
    <p class="details" id="camera-details">카메라 화면은 이 PC에서만 미리 볼 수 있습니다. 시험이 끝나면 카메라가 자동으로 꺼집니다.</p>
  </main>
</body>
</html>
